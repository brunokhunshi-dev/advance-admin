<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Advance Admin — Login</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="midia/logo-advancecheck.svg">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-screen">
    <div class="login-panel">
        <img class="brand-logo" src="midia/logo-advancecheck.svg" alt="Advance Check">
        <span class="eyebrow">PAINEL ADMINISTRATIVO</span>
        <h1>Acesso administrativo</h1>
        <p>Use uma conta autorizada para acessar os dados do Advance Check.</p>
        <form id="login-form" class="login-form">
            <label>E-mail<input id="login-email" type="email" autocomplete="email" required></label>
            <label>Senha<input id="login-password" type="password" autocomplete="current-password" required></label>
            <button id="login-button" class="primary-button" type="submit">Entrar</button>
            <p id="login-message" class="form-message" role="alert"></p>
        </form>
        <div class="debug-box">
            <button id="debug-toggle" class="debug-toggle" type="button" aria-expanded="false">Diagnóstico técnico</button>
            <div id="debug-panel" class="debug-panel" hidden>
                <div class="debug-actions">
                    <button id="debug-run" class="secondary-button" type="button">Executar diagnóstico</button>
                    <button id="debug-copy" class="text-button" type="button" disabled>Copiar resultado</button>
                </div>
                <p id="debug-summary" class="debug-summary">Verifica domínio, configuração e resposta do Firebase Authentication.</p>
                <div id="debug-results" class="debug-results" aria-live="polite"></div>
            </div>
        </div>
    </div>
</div>
<script type="module" src="login.js"></script>
</body>
</html>
